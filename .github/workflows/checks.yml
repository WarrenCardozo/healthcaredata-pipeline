name: Healthcare Pipeline - Full Audit Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'   # Daily at midnight UTC
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:

  # ============================================================
  # JOB 1 — BASELINE (everything passes)
  # Checks that PASS:
  #   HIPAA, NDHM, PRIVACY, SELECTION BIAS (both),
  #   MEASUREMENT BIAS, GROUP DISPARITY, SAMPLE SIZE,
  #   DATA QUALITY, CONSENT
  # ============================================================
  audit_baseline:
    name: "Baseline — All Checks Pass"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate baseline dataset
        run: |
          python - <<'EOF'
          import pandas as pd, numpy as np
          np.random.seed(1)
          n = 100
          delivery = np.random.choice(['Vaginal','C-Section'], n, p=[0.7,0.3])
          data = {
            'PatientID':     [f'PT{i:04d}' for i in range(1, n+1)],
            'Age':           np.random.randint(20, 40, n),
            'DeliveryType':  delivery,
            'LOS':           [np.random.choice([2,3,4]) if d=='Vaginal'
                              else np.random.choice([3,4,5]) for d in delivery],
            'Complications': np.random.choice(['Yes','No'], n, p=[0.15,0.85]),
            'Readmitted':    np.random.choice(['Yes','No'], n, p=[0.05,0.95]),
            'Location':      np.random.choice(['Urban','Suburban','Rural'], n, p=[0.4,0.3,0.3]),
            'ConsentObtained': ['Yes'] * n,
          }
          pd.DataFrame(data).to_csv('test_baseline.csv', index=False)
          print("Generated test_baseline.csv")
          EOF

      - name: Run pipeline
        run: python pipeline.py test_baseline.csv report_baseline.pdf

      - name: Verify no FAILs in audit (except expected structural ones)
        run: |
          python - <<'EOF'
          # Re-run audit in isolation and assert all checks pass
          import pandas as pd, sys
          sys.path.insert(0, '.')
          from cleaner import clean_data
          from ethics_auditor import audit_ethics
          df, _ = clean_data(pd.read_csv('test_baseline.csv'))
          flags = audit_ethics(df)
          fails = [f for f in flags if f.strip().startswith('FAIL')]
          if fails:
              print("UNEXPECTED FAILs:")
              for f in fails: print(" ", f)
              sys.exit(1)
          print("All checks passed as expected.")
          EOF

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report-baseline
          path: |
            report_baseline.pdf
            hipaa_ndhm_violations.txt


  # ============================================================
  # JOB 2 — HIPAA VIOLATION
  # Trigger: column named 'SSN' present in dataset
  # Checks that FAIL: HIPAA, PRIVACY
  # ============================================================
  audit_hipaa_violation:
    name: "HIPAA — PHI Column Detected"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt

      - name: Generate dataset with PHI columns
        run: |
          python - <<'EOF'
          import pandas as pd, numpy as np
          np.random.seed(2)
          n = 50
          data = {
            'PatientID':    [f'PT{i:04d}' for i in range(1, n+1)],
            'Age':          np.random.randint(20, 40, n),
            'SSN':          [f'{np.random.randint(100,999)}-{np.random.randint(10,99)}-{np.random.randint(1000,9999)}'
                             for _ in range(n)],         # <-- HIPAA PHI
            'Email':        [f'patient{i}@example.com' for i in range(n)],  # <-- HIPAA PHI
            'DeliveryType': np.random.choice(['Vaginal','C-Section'], n, p=[0.7,0.3]),
            'LOS':          np.random.randint(2, 5, n),
            'Complications':np.random.choice(['Yes','No'], n, p=[0.15,0.85]),
            'Readmitted':   np.random.choice(['Yes','No'], n, p=[0.05,0.95]),
            'Location':     np.random.choice(['Urban','Suburban','Rural'], n, p=[0.4,0.3,0.3]),
            'ConsentObtained': ['Yes'] * n,
          }
          pd.DataFrame(data).to_csv('test_hipaa.csv', index=False)
          EOF

      - name: Run pipeline
        run: python pipeline.py test_hipaa.csv report_hipaa.pdf

      - name: Assert HIPAA and PRIVACY both FAIL
        run: |
          python - <<'EOF'
          import pandas as pd, sys
          sys.path.insert(0, '.')
          from cleaner import clean_data
          from ethics_auditor import audit_ethics
          df, _ = clean_data(pd.read_csv('test_hipaa.csv'))
          flags = audit_ethics(df)
          required_fails = ['[HIPAA]', '[PRIVACY]']
          for tag in required_fails:
              match = [f for f in flags if tag in f and f.strip().startswith('FAIL')]
              if not match:
                  print(f"Expected FAIL for {tag} but none found")
                  sys.exit(1)
          print("HIPAA and PRIVACY FAILs confirmed.")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: report-hipaa-violation
          path: |
            report_hipaa.pdf
            hipaa_ndhm_violations.txt


  # ============================================================
  # JOB 3 — NDHM VIOLATION
  # Trigger: column named 'AadhaarNumber' present
  # Checks that FAIL: NDHM, PRIVACY
  # ============================================================
  audit_ndhm_violation:
    name: "NDHM — Indian Identifier Column Detected"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt

      - name: Generate dataset with NDHM identifiers
        run: |
          python - <<'EOF'
          import pandas as pd, numpy as np
          np.random.seed(3)
          n = 50
          data = {
            'PatientID':     [f'PT{i:04d}' for i in range(1, n+1)],
            'Age':           np.random.randint(20, 40, n),
            'AadhaarNumber': [f'{np.random.randint(1000,9999)}-{np.random.randint(1000,9999)}-{np.random.randint(1000,9999)}'
                              for _ in range(n)],     # <-- NDHM identifier
            'DeliveryType':  np.random.choice(['Vaginal','C-Section'], n, p=[0.7,0.3]),
            'LOS':           np.random.randint(2, 5, n),
            'Complications': np.random.choice(['Yes','No'], n, p=[0.15,0.85]),
            'Readmitted':    np.random.choice(['Yes','No'], n, p=[0.05,0.95]),
            'Location':      np.random.choice(['Urban','Suburban','Rural'], n, p=[0.4,0.3,0.3]),
            'ConsentObtained': ['Yes'] * n,
          }
          pd.DataFrame(data).to_csv('test_ndhm.csv', index=False)
          EOF

      - name: Run pipeline
        run: python pipeline.py test_ndhm.csv report_ndhm.pdf

      - name: Assert NDHM and PRIVACY both FAIL
        run: |
          python - <<'EOF'
          import pandas as pd, sys
          sys.path.insert(0, '.')
          from cleaner import clean_data
          from ethics_auditor import audit_ethics
          df, _ = clean_data(pd.read_csv('test_ndhm.csv'))
          flags = audit_ethics(df)
          for tag in ['[NDHM]', '[PRIVACY]']:
              if not any(tag in f and f.strip().startswith('FAIL') for f in flags):
                  print(f"Expected FAIL for {tag} — not found")
                  sys.exit(1)
          print("NDHM and PRIVACY FAILs confirmed.")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: report-ndhm-violation
          path: |
            report_ndhm.pdf
            hipaa_ndhm_violations.txt


  # ============================================================
  # JOB 4 — SELECTION BIAS (urban heavy, rural under 30%)
  # Trigger: Rural < 30%, Urban > 70%
  # Checks that FAIL: SELECTION BIAS (both sub-checks)
  # ============================================================
  audit_selection_bias:
    name: "Selection Bias — Rural Underrepresented"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt

      - name: Generate urban-heavy dataset
        run: |
          python - <<'EOF'
          import pandas as pd, numpy as np
          np.random.seed(4)
          n = 100
          delivery = np.random.choice(['Vaginal','C-Section'], n, p=[0.7,0.3])
          data = {
            'PatientID':    [f'PT{i:04d}' for i in range(1, n+1)],
            'Age':          np.random.randint(20, 40, n),
            'DeliveryType': delivery,
            'LOS':          [np.random.choice([2,3]) if d=='Vaginal'
                             else np.random.choice([3,4]) for d in delivery],
            'Complications':np.random.choice(['Yes','No'], n, p=[0.15,0.85]),
            'Readmitted':   np.random.choice(['Yes','No'], n, p=[0.05,0.95]),
            'Location':     np.random.choice(['Urban','Suburban','Rural'], n,
                             p=[0.85, 0.10, 0.05]),   # <-- Rural only 5%
            'ConsentObtained': ['Yes'] * n,
          }
          pd.DataFrame(data).to_csv('test_selection_bias.csv', index=False)
          EOF

      - name: Run pipeline
        run: python pipeline.py test_selection_bias.csv report_selection_bias.pdf

      - name: Assert SELECTION BIAS FAILs
        run: |
          python - <<'EOF'
          import pandas as pd, sys
          sys.path.insert(0, '.')
          from cleaner import clean_data
          from ethics_auditor import audit_ethics
          df, _ = clean_data(pd.read_csv('test_selection_bias.csv'))
          flags = audit_ethics(df)
          sb_fails = [f for f in flags if '[SELECTION BIAS]' in f and f.strip().startswith('FAIL')]
          if not sb_fails:
              print("Expected SELECTION BIAS FAIL — not found")
              sys.exit(1)
          print(f"Selection bias FAILs confirmed: {len(sb_fails)} flag(s)")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: report-selection-bias
          path: report_selection_bias.pdf


  # ============================================================
  # JOB 5 — MEASUREMENT BIAS (>30% complication rate gap)
  # Trigger: Large complication rate difference between delivery types
  # Checks that FAIL: MEASUREMENT BIAS
  # ============================================================
  audit_measurement_bias:
    name: "Measurement Bias — Complication Rate Gap >30%"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt

      - name: Generate dataset with extreme complication rate gap
        run: |
          python - <<'EOF'
          import pandas as pd, numpy as np
          np.random.seed(5)
          # Vaginal: 5% complications, C-Section: 70% complications -> 65% gap
          vaginal = pd.DataFrame({
            'PatientID':    [f'PTV{i:03d}' for i in range(1, 71)],
            'Age':          np.random.randint(20, 40, 70),
            'DeliveryType': ['Vaginal'] * 70,
            'LOS':          np.random.choice([2, 3], 70),
            'Complications':np.random.choice(['Yes','No'], 70, p=[0.05, 0.95]),
            'Readmitted':   np.random.choice(['Yes','No'], 70, p=[0.02, 0.98]),
            'Location':     np.random.choice(['Urban','Suburban','Rural'], 70, p=[0.4,0.3,0.3]),
            'ConsentObtained': ['Yes'] * 70,
          })
          csection = pd.DataFrame({
            'PatientID':    [f'PTC{i:03d}' for i in range(1, 31)],
            'Age':          np.random.randint(20, 40, 30),
            'DeliveryType': ['C-Section'] * 30,
            'LOS':          np.random.choice([3, 4, 5], 30),
            'Complications':np.random.choice(['Yes','No'], 30, p=[0.70, 0.30]),
            'Readmitted':   np.random.choice(['Yes','No'], 30, p=[0.20, 0.80]),
            'Location':     np.random.choice(['Urban','Suburban','Rural'], 30, p=[0.4,0.3,0.3]),
            'ConsentObtained': ['Yes'] * 30,
          })
          pd.concat([vaginal, csection]).to_csv('test_measurement_bias.csv', index=False)
          EOF

      - name: Run pipeline
        run: python pipeline.py test_measurement_bias.csv report_measurement_bias.pdf

      - name: Assert MEASUREMENT BIAS FAIL
        run: |
          python - <<'EOF'
          import pandas as pd, sys
          sys.path.insert(0, '.')
          from cleaner import clean_data
          from ethics_auditor import audit_ethics
          df, _ = clean_data(pd.read_csv('test_measurement_bias.csv'))
          flags = audit_ethics(df)
          if not any('[MEASUREMENT BIAS]' in f and f.strip().startswith('FAIL') for f in flags):
              print("Expected MEASUREMENT BIAS FAIL — not found")
              sys.exit(1)
          print("Measurement bias FAIL confirmed.")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: report-measurement-bias
          path: report_measurement_bias.pdf


  # ============================================================
  # JOB 6 — GROUP DISPARITY (LOS gap >2 days Urban vs Rural)
  # Trigger: Rural patients have significantly longer LOS
  # Checks that FAIL: GROUP DISPARITY
  # ============================================================
  audit_group_disparity:
    name: "Group Disparity — Urban vs Rural LOS Gap >2 Days"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt

      - name: Generate dataset with LOS disparity
        run: |
          python - <<'EOF'
          import pandas as pd, numpy as np
          np.random.seed(6)
          urban = pd.DataFrame({
            'PatientID':    [f'PTU{i:03d}' for i in range(1, 51)],
            'Age':          np.random.randint(20, 40, 50),
            'DeliveryType': np.random.choice(['Vaginal','C-Section'], 50, p=[0.7,0.3]),
            'LOS':          np.random.choice([2, 3], 50),       # short stays
            'Complications':np.random.choice(['Yes','No'], 50, p=[0.15,0.85]),
            'Readmitted':   np.random.choice(['Yes','No'], 50, p=[0.05,0.95]),
            'Location':     ['Urban'] * 50,
            'ConsentObtained': ['Yes'] * 50,
          })
          rural = pd.DataFrame({
            'PatientID':    [f'PTR{i:03d}' for i in range(1, 51)],
            'Age':          np.random.randint(20, 40, 50),
            'DeliveryType': np.random.choice(['Vaginal','C-Section'], 50, p=[0.7,0.3]),
            'LOS':          np.random.choice([5, 6, 7], 50),    # much longer stays
            'Complications':np.random.choice(['Yes','No'], 50, p=[0.15,0.85]),
            'Readmitted':   np.random.choice(['Yes','No'], 50, p=[0.05,0.95]),
            'Location':     ['Rural'] * 50,
            'ConsentObtained': ['Yes'] * 50,
          })
          pd.concat([urban, rural]).to_csv('test_group_disparity.csv', index=False)
          EOF

      - name: Run pipeline
        run: python pipeline.py test_group_disparity.csv report_group_disparity.pdf

      - name: Assert GROUP DISPARITY FAIL
        run: |
          python - <<'EOF'
          import pandas as pd, sys
          sys.path.insert(0, '.')
          from cleaner import clean_data
          from ethics_auditor import audit_ethics
          df, _ = clean_data(pd.read_csv('test_group_disparity.csv'))
          flags = audit_ethics(df)
          if not any('[GROUP DISPARITY]' in f and f.strip().startswith('FAIL') for f in flags):
              print("Expected GROUP DISPARITY FAIL — not found")
              sys.exit(1)
          print("Group disparity FAIL confirmed.")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: report-group-disparity
          path: report_group_disparity.pdf


  # ============================================================
  # JOB 7 — SMALL SAMPLE SIZE (<30 patients)
  # Trigger: Only 15 records in dataset
  # Checks that FAIL: SAMPLE SIZE
  # ============================================================
  audit_small_sample:
    name: "Sample Size — Under 30 Patients"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt

      - name: Generate tiny dataset
        run: |
          python - <<'EOF'
          import pandas as pd, numpy as np
          np.random.seed(7)
          n = 15
          delivery = np.random.choice(['Vaginal','C-Section'], n, p=[0.7,0.3])
          data = {
            'PatientID':    [f'PT{i:04d}' for i in range(1, n+1)],
            'Age':          np.random.randint(20, 40, n),
            'DeliveryType': delivery,
            'LOS':          [2 if d=='Vaginal' else 4 for d in delivery],
            'Complications':np.random.choice(['Yes','No'], n, p=[0.15,0.85]),
            'Readmitted':   np.random.choice(['Yes','No'], n, p=[0.05,0.95]),
            'Location':     np.random.choice(['Urban','Suburban','Rural'], n, p=[0.4,0.3,0.3]),
            'ConsentObtained': ['Yes'] * n,
          }
          pd.DataFrame(data).to_csv('test_small_sample.csv', index=False)
          EOF

      - name: Run pipeline
        run: python pipeline.py test_small_sample.csv report_small_sample.pdf

      - name: Assert SAMPLE SIZE FAIL
        run: |
          python - <<'EOF'
          import pandas as pd, sys
          sys.path.insert(0, '.')
          from cleaner import clean_data
          from ethics_auditor import audit_ethics
          df, _ = clean_data(pd.read_csv('test_small_sample.csv'))
          flags = audit_ethics(df)
          if not any('[SAMPLE SIZE]' in f and f.strip().startswith('FAIL') for f in flags):
              print("Expected SAMPLE SIZE FAIL — not found")
              sys.exit(1)
          print("Sample size FAIL confirmed.")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: report-small-sample
          path: report_small_sample.pdf


  # ============================================================
  # JOB 8 — MISSING DATA (>10% overall)
  # Trigger: Heavy missing values seeded across multiple columns
  # Checks that FAIL: DATA QUALITY, MISSING (per-column)
  # ============================================================
  audit_missing_data:
    name: "Data Quality — Missing Values >10%"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt

      - name: Generate dataset with heavy missing values
        run: |
          python - <<'EOF'
          import pandas as pd, numpy as np
          np.random.seed(8)
          n = 80
          delivery = np.random.choice(['Vaginal','C-Section'], n, p=[0.7,0.3])
          df = pd.DataFrame({
            'PatientID':    [f'PT{i:04d}' for i in range(1, n+1)],
            'Age':          np.random.randint(20, 40, n).astype(float),
            'DeliveryType': delivery,
            'LOS':          np.random.choice([2,3,4,5], n).astype(float),
            'Complications':np.random.choice(['Yes','No'], n, p=[0.15,0.85]),
            'Readmitted':   np.random.choice(['Yes','No'], n, p=[0.05,0.95]),
            'Location':     np.random.choice(['Urban','Suburban','Rural'], n, p=[0.4,0.3,0.3]),
            'ConsentObtained': ['Yes'] * n,
          })
          # Inject ~20% missing across Age and LOS
          missing_idx = np.random.choice(n, size=int(n * 0.20), replace=False)
          df.loc[missing_idx[:10], 'Age'] = np.nan
          df.loc[missing_idx[10:], 'LOS'] = np.nan
          df.to_csv('test_missing_data.csv', index=False)
          EOF

      - name: Run pipeline
        run: python pipeline.py test_missing_data.csv report_missing_data.pdf

      - name: Assert DATA QUALITY or MISSING FAIL
        run: |
          python - <<'EOF'
          import pandas as pd, sys
          sys.path.insert(0, '.')
          from cleaner import clean_data
          from ethics_auditor import audit_ethics
          # Audit runs on raw data BEFORE imputation to catch missing values
          df_raw = pd.read_csv('test_missing_data.csv')
          df_clean, _ = clean_data(df_raw)
          # Re-inject nulls to simulate pre-imputation audit (cleaner fills them)
          flags = audit_ethics(df_raw)
          dq_fails = [f for f in flags if ('[DATA QUALITY]' in f or '[MISSING]' in f)
                      and f.strip().startswith('FAIL')]
          if not dq_fails:
              print("Expected DATA QUALITY/MISSING FAIL — not found")
              sys.exit(1)
          print(f"Data quality FAILs confirmed: {len(dq_fails)} flag(s)")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: report-missing-data
          path: report_missing_data.pdf


  # ============================================================
  # JOB 9 — CONSENT DENIED (some patients said No)
  # Trigger: ConsentObtained column has 'No' values
  # Checks that FAIL: CONSENT (with patient IDs listed)
  # ============================================================
  audit_consent_denied:
    name: "Consent — Patients Denied Consent"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt

      - name: Use pre-built demo file
        run: cp demo_consent_fail.csv test_consent_denied.csv

      - name: Run pipeline
        run: python pipeline.py test_consent_denied.csv report_consent_denied.pdf

      - name: Assert CONSENT FAIL with denied patient IDs
        run: |
          python - <<'EOF'
          import pandas as pd, sys
          sys.path.insert(0, '.')
          from cleaner import clean_data
          from ethics_auditor import audit_ethics
          df, _ = clean_data(pd.read_csv('test_consent_denied.csv'))
          flags = audit_ethics(df)
          consent_fails = [f for f in flags if '[CONSENT]' in f and f.strip().startswith('FAIL')]
          if not consent_fails:
              print("Expected CONSENT FAIL — not found")
              sys.exit(1)
          has_ids = any('PatientID' in f or 'PT' in f for f in consent_fails)
          if not has_ids:
              print("Expected denied patient IDs in CONSENT flag — not found")
              sys.exit(1)
          print(f"Consent FAILs confirmed with patient IDs: {len(consent_fails)} flag(s)")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: report-consent-denied
          path: report_consent_denied.pdf


  # ============================================================
  # JOB 10 — CONSENT MISSING COLUMN
  # Trigger: No column containing the word 'consent' at all
  # Checks that FAIL: CONSENT (no tracking column)
  # ============================================================
  audit_consent_no_column:
    name: "Consent — No Consent Column Present"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt

      - name: Generate dataset with no consent column
        run: |
          python - <<'EOF'
          import pandas as pd, numpy as np
          np.random.seed(10)
          n = 50
          delivery = np.random.choice(['Vaginal','C-Section'], n, p=[0.7,0.3])
          data = {
            'PatientID':    [f'PT{i:04d}' for i in range(1, n+1)],
            'Age':          np.random.randint(20, 40, n),
            'DeliveryType': delivery,
            'LOS':          [2 if d=='Vaginal' else 4 for d in delivery],
            'Complications':np.random.choice(['Yes','No'], n, p=[0.15,0.85]),
            'Readmitted':   np.random.choice(['Yes','No'], n, p=[0.05,0.95]),
            'Location':     np.random.choice(['Urban','Suburban','Rural'], n, p=[0.4,0.3,0.3]),
            # No ConsentObtained column at all
          }
          pd.DataFrame(data).to_csv('test_no_consent_col.csv', index=False)
          EOF

      - name: Run pipeline
        run: python pipeline.py test_no_consent_col.csv report_no_consent_col.pdf

      - name: Assert CONSENT FAIL for missing column
        run: |
          python - <<'EOF'
          import pandas as pd, sys
          sys.path.insert(0, '.')
          from cleaner import clean_data
          from ethics_auditor import audit_ethics
          df, _ = clean_data(pd.read_csv('test_no_consent_col.csv'))
          flags = audit_ethics(df)
          if not any('[CONSENT]' in f and f.strip().startswith('FAIL') for f in flags):
              print("Expected CONSENT FAIL for missing column — not found")
              sys.exit(1)
          print("Consent FAIL (no column) confirmed.")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: report-no-consent-col
          path: report_no_consent_col.pdf


  # ============================================================
  # JOB 11 — CONSENT UNKNOWN VALUES
  # Trigger: ConsentObtained has blank/unrecognised values
  # Checks that FAIL: CONSENT (unrecognised values)
  # ============================================================
  audit_consent_unknown:
    name: "Consent — Unrecognised Consent Values"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt

      - name: Generate dataset with blank/unknown consent values
        run: |
          python - <<'EOF'
          import pandas as pd, numpy as np
          np.random.seed(11)
          n = 50
          delivery = np.random.choice(['Vaginal','C-Section'], n, p=[0.7,0.3])
          consent = ['Yes'] * n
          # Set 8 records to blank or unrecognised values
          for i in [2, 7, 12, 18, 24, 31, 38, 45]:
              consent[i] = np.random.choice(['', 'Pending', 'N/A', 'Maybe'])
          data = {
            'PatientID':     [f'PT{i:04d}' for i in range(1, n+1)],
            'Age':           np.random.randint(20, 40, n),
            'DeliveryType':  delivery,
            'LOS':           [2 if d=='Vaginal' else 4 for d in delivery],
            'Complications': np.random.choice(['Yes','No'], n, p=[0.15,0.85]),
            'Readmitted':    np.random.choice(['Yes','No'], n, p=[0.05,0.95]),
            'Location':      np.random.choice(['Urban','Suburban','Rural'], n, p=[0.4,0.3,0.3]),
            'ConsentObtained': consent,
          }
          pd.DataFrame(data).to_csv('test_consent_unknown.csv', index=False)
          EOF

      - name: Run pipeline
        run: python pipeline.py test_consent_unknown.csv report_consent_unknown.pdf

      - name: Assert CONSENT FAIL for unknown values
        run: |
          python - <<'EOF'
          import pandas as pd, sys
          sys.path.insert(0, '.')
          from cleaner import clean_data
          from ethics_auditor import audit_ethics
          df, _ = clean_data(pd.read_csv('test_consent_unknown.csv'))
          flags = audit_ethics(df)
          unknown_fails = [f for f in flags if '[CONSENT]' in f
                           and 'unrecognised' in f and f.strip().startswith('FAIL')]
          if not unknown_fails:
              print("Expected CONSENT FAIL for unrecognised values — not found")
              sys.exit(1)
          print("Consent FAIL (unknown values) confirmed.")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: report-consent-unknown
          path: report_consent_unknown.pdf


  # ============================================================
  # JOB 12 — MISSING REQUIRED COLUMNS
  # Trigger: DeliveryType, Location columns absent
  # Checks that FAIL: MEASUREMENT BIAS, GROUP DISPARITY,
  #                   SELECTION BIAS (missing column path)
  # ============================================================
  audit_missing_columns:
    name: "Missing Columns — DeliveryType and Location Absent"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt

      - name: Generate dataset missing key columns
        run: |
          python - <<'EOF'
          import pandas as pd, numpy as np
          np.random.seed(12)
          n = 50
          data = {
            'PatientID':    [f'PT{i:04d}' for i in range(1, n+1)],
            'Age':          np.random.randint(20, 40, n),
            # No DeliveryType, no Location
            'LOS':          np.random.choice([2,3,4,5], n),
            'Complications':np.random.choice(['Yes','No'], n, p=[0.15,0.85]),
            'Readmitted':   np.random.choice(['Yes','No'], n, p=[0.05,0.95]),
            'ConsentObtained': ['Yes'] * n,
          }
          pd.DataFrame(data).to_csv('test_missing_cols.csv', index=False)
          EOF

      - name: Run pipeline
        run: python pipeline.py test_missing_cols.csv report_missing_cols.pdf

      - name: Assert structural FAILs for missing columns
        run: |
          python - <<'EOF'
          import pandas as pd, sys
          sys.path.insert(0, '.')
          from cleaner import clean_data
          from ethics_auditor import audit_ethics
          df, _ = clean_data(pd.read_csv('test_missing_cols.csv'))
          flags = audit_ethics(df)
          expected = ['[MEASUREMENT BIAS]', '[GROUP DISPARITY]', '[SELECTION BIAS]']
          for tag in expected:
              if not any(tag in f and f.strip().startswith('FAIL') for f in flags):
                  print(f"Expected FAIL for {tag} — not found")
                  sys.exit(1)
          print("All missing-column FAILs confirmed.")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: report-missing-cols
          path: report_missing_cols.pdf


  # ============================================================
  # SUMMARY JOB — runs after all jobs, prints pass/fail matrix
  # ============================================================
  summary:
    name: "Audit Matrix Summary"
    runs-on: ubuntu-latest
    needs:
      - audit_baseline
      - audit_hipaa_violation
      - audit_ndhm_violation
      - audit_selection_bias
      - audit_measurement_bias
      - audit_group_disparity
      - audit_small_sample
      - audit_missing_data
      - audit_consent_denied
      - audit_consent_no_column
      - audit_consent_unknown
      - audit_missing_columns
    if: always()
    steps:
      - name: Print audit matrix
        run: |
          echo "======================================================="
          echo "  HEALTHCARE PIPELINE — AUDIT CHECK MATRIX RESULTS"
          echo "======================================================="
          echo ""
          echo "  Job                          | Expected outcome"
          echo "  -----------------------------|---------------------------"
          echo "  01 Baseline                  | All checks PASS"
          echo "  02 HIPAA violation           | HIPAA + PRIVACY FAIL"
          echo "  03 NDHM violation            | NDHM + PRIVACY FAIL"
          echo "  04 Selection bias            | SELECTION BIAS FAIL (x2)"
          echo "  05 Measurement bias          | MEASUREMENT BIAS FAIL"
          echo "  06 Group disparity           | GROUP DISPARITY FAIL"
          echo "  07 Small sample              | SAMPLE SIZE FAIL"
          echo "  08 Missing data              | DATA QUALITY + MISSING FAIL"
          echo "  09 Consent denied            | CONSENT FAIL + patient IDs"
          echo "  10 No consent column         | CONSENT FAIL (no column)"
          echo "  11 Unknown consent values    | CONSENT FAIL (unrecognised)"
          echo "  12 Missing required columns  | MEASUREMENT BIAS +"
          echo "                               | GROUP DISPARITY +"
          echo "                               | SELECTION BIAS FAIL"
          echo "======================================================="
          echo ""
          echo "  See individual job logs and uploaded PDF artifacts"
          echo "  for the full colour-coded audit results."
          echo "======================================================="
