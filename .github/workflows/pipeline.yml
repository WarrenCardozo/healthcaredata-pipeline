name: Run Data Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Manual trigger

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run pipeline on clean data
        run: |
          python pipeline.py maternity_master.csv report_clean.pdf
      
      - name: Run pipeline on biased data
        run: |
          python pipeline.py maternity_biased.csv report_biased.pdf
      
      - name: Run pipeline on missing data
        run: |
          python pipeline.py maternity_missing.csv report_missing.pdf
      
      - name: Upload reports
        uses: actions/upload-artifact@v3
        with:
          name: analysis-reports
          path: |
            report_*.pdf
            plots/
          retention-days: 30
